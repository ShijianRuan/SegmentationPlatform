# 平台统一器官名称表（Anatomy Vocabulary）
#
# 这份表只回答“这是哪个器官”。它【不】保存训练用的整数编号——
# 那些编号按训练任务分别定义在 pipelines/nnunet/ModelMap*.toml（TaskLabelMap）
# 和合并输出编号表（Combine Map）中。同一器官在不同任务里可以是不同整数。
# 依据：平台蓝图 §7.1、ADR-002、ADR-017。
#
# 来源：由 pipelines/nnunet/ModelMap*.toml 中实际出现的器官名生成（共 126 个）。
# 收录范围 = 任何 ModelMap 出现过的器官名，包含尚未实现或由独立模型负责的任务
#   （例如 uterus 在 ModelMap 标注为 #暂未实现）。任务的实现状态不在本表记录，
#   本表只保证“TaskLabelMap 用到的名称都能在这里查到”。
# 新数据集若使用别名，在对应器官的 aliases 下追加，不要新增重复的规范名。

